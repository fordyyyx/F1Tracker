# ---------------------------------------------------------------
# Build system: how pip turns your src/ folder into an installable package
# ---------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------
# Project metadata (the only truly required bits are name + version)
# ---------------------------------------------------------------
[project]
name = "f1-tracker"
version = "0.1.0"
description = "Formula 1 championship tracker with configurable rules, standings and stats"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Will Ford" }]

# Runtime dependencies - things the app needs to run.
dependencies = []

# Dev-only dependencies - installed with: pip install -e ".[dev]"
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

# Creates an `f1-tracker` terminal command that calls main() in cli.py
[project.scripts]
f1-tracker = "f1_tracker.cli:main"

# Tells hatchling where the package lives (src layout)
[tool.hatch.build.targets.wheel]
packages = ["src/f1_tracker"]

# ---------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # prints a summary of skipped/failed tests at the end

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = standard errors, I = import sorting, B = bugbear (common bugs),
# UP = modern syntax, SIM = simplifications.
# Bugbear's B006 flags mutable default arguments - the bug in v1.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true